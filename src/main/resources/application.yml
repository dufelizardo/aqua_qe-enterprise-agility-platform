spring:
  application:
    name: aqua-qe-platform
  threads:
    virtual:
      enabled: true
  # Anexos (#13): o arquivo tem o limite de aquaqe.attachments.max-size; o proxy (nginx) aceita até 12 MB.
  servlet:
    multipart:
      max-file-size: ${aquaqe.attachments.max-size}
      max-request-size: -1
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/aquaqe}
    username: ${DATABASE_USERNAME:aquaqe}
    password: ${DATABASE_PASSWORD:aquaqe}
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: ${aquaqe.auth.client-id}
            # Valor local de desenvolvimento; nos ambientes vem do Secret auth-client.
            client-secret: ${AUTH_CLIENT_SECRET:aquaqe-web-local}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid,profile,email
        provider:
          keycloak:
            # O navegador vai ao endereço público; a API fala com o Keycloak pelo endereço interno.
            authorization-uri: ${aquaqe.auth.public-url}/realms/${aquaqe.auth.realm}/protocol/openid-connect/auth
            token-uri: ${aquaqe.auth.internal-url}/realms/${aquaqe.auth.realm}/protocol/openid-connect/token
            jwk-set-uri: ${aquaqe.auth.internal-url}/realms/${aquaqe.auth.realm}/protocol/openid-connect/certs
            user-name-attribute: preferred_username
      resourceserver:
        jwt:
          jwk-set-uri: ${aquaqe.auth.internal-url}/realms/${aquaqe.auth.realm}/protocol/openid-connect/certs
          issuer-uri: ${aquaqe.auth.public-url}/realms/${aquaqe.auth.realm}

aquaqe:
  # Âncoras da cadeia de hash da auditoria (#8; REV-03): a cada intervalo, se a trilha cresceu.
  audit:
    anchor:
      enabled: ${AQUAQE_AUDIT_ANCHOR_ENABLED:true}
      interval: ${AQUAQE_AUDIT_ANCHOR_INTERVAL:PT1H}
  # Tamanho máximo de cada anexo (#13); acima dele, 413 ATTACHMENT_TOO_LARGE.
  attachments:
    max-size: ${AQUAQE_ATTACHMENT_MAX_SIZE:10MB}
  # local, dev ou prod. Em prod, o modo sem senha é recusado na subida (ADR-17).
  environment: ${AQUAQE_ENVIRONMENT:local}
  auth:
    # oidc (login pelo Keycloak) ou dev-persona (sem senha, ambiente dev).
    mode: ${AQUAQE_AUTH_MODE:oidc}
    public-url: ${AUTH_PUBLIC_URL:http://localhost:8180}
    internal-url: ${AUTH_INTERNAL_URL:http://localhost:8180}
    realm: ${AUTH_REALM:aquaqe-dev}
    client-id: ${AUTH_CLIENT_ID:aquaqe-web}
    # Personas do modo dev-persona, uma por papel do SSD (seção 2); a primeira é a padrão. Também são os usuários
    # de teste do realm aquaqe-dev (Robot no CI).
    dev-personas:
      - { username: robot.pm, name: Paula Produto, email: robot.pm@aquaqe.local, role: PRODUCT_MANAGER }
      - { username: robot.admin, name: Alice Admin, email: robot.admin@aquaqe.local, role: PLATFORM_ADMIN }
      - { username: robot.bo, name: Bruno Owner, email: robot.bo@aquaqe.local, role: BUSINESS_OWNER }
      - { username: robot.tl, name: Tiago Lead, email: robot.tl@aquaqe.local, role: TECH_LEAD }
      - { username: robot.ux, name: Ursula Design, email: robot.ux@aquaqe.local, role: UX_DESIGNER }
      - { username: robot.qa, name: Quezia Qualidade, email: robot.qa@aquaqe.local, role: QA_ENGINEER }
      - { username: robot.squad, name: Sergio Squad, email: robot.squad@aquaqe.local, role: SQUAD_MEMBER }
      - { username: robot.viewer, name: Vera Leitura, email: robot.viewer@aquaqe.local, role: VIEWER }
  # Papéis iniciais na unidade raiz (SSD, seção 8.5), dados no primeiro acesso de cada conta.
  access:
    # Usuário do IdP que recebe PLATFORM_ADMIN na raiz (o "usuário inicial indicado na instalação").
    admin-username: ${AQUAQE_ADMIN_USERNAME:}
    # Cada persona recebe o seu papel na raiz. Sempre ligado no modo dev-persona; proibido em produção.
    persona-roles: ${AQUAQE_PERSONA_ROLES:false}
  # Outbox e auditoria (SAD 7.4 e 7.5; OPERACAO 6.1). Valores provisórios até o REV-03 fixar o SLA.
  events:
    relay:
      delay: ${AQUAQE_EVENTS_RELAY_DELAY:PT1S}
    # SLA da auditoria (#8; REV-03): alvo de 1 min; com mais de 5 min de atraso, alerta e /actuator/health em DELAYED.
    lag-alert: ${AQUAQE_EVENTS_LAG_ALERT:PT5M}
    # Tentativas de um consumidor que não é a auditoria antes de o evento ir para a fila de falhas (D-03).
    max-attempts: ${AQUAQE_EVENTS_MAX_ATTEMPTS:5}
    retention-days: ${AQUAQE_EVENTS_RETENTION_DAYS:7}

server:
  # Atrás do nginx e do Traefik: usa X-Forwarded-* para montar o redirect do login com o endereço que o navegador vê.
  forward-headers-strategy: framework
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      # O componente "audit" mostra DELAYED quando a trilha atrasa (#8); as sondas de prontidão e de vida não o usam.
      show-components: always
      status:
        order: DOWN, OUT_OF_SERVICE, DELAYED, UP, UNKNOWN
        http-mapping:
          DELAYED: 200
  info:
    env:
      enabled: true

info:
  app:
    name: AQuA-QE Enterprise Agility Platform
    version: "@project.version@"
