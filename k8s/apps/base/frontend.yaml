# Frontend (nginx com o SPA). O nginx repassa /api, /oauth2, /login/oauth2 e /logout ao Service app.
# O host do Ingress é o nome mDNS do ambiente, definido no overlay.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: aquaqe-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aquaqe-frontend
  template:
    metadata:
      labels:
        app: aquaqe-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/dufelizardo/aqua-qe-platform-frontend:developer
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: BACKEND_URL
              value: http://app
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 20
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector:
    app: aquaqe-frontend
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend
spec:
  ingressClassName: traefik
  rules:
    - host: AMBIENTE.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
