# Aplicação do ArgoCD (GitOps). Aplicar no servidor: kubectl apply -f <este arquivo> (ou -f k8s/argocd/ para todas).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aqua-qe-agility-platform-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/dufelizardo/aqua_qe-enterprise-agility-platform.git
    targetRevision: main
    path: k8s/apps/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: aqua-qe-agility-platform-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
