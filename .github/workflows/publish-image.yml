# Publica as imagens no ghcr.io a cada push na developer (ambiente dev) e na main (ambiente prod) e grava o SHA
# no overlay do ambiente; o ArgoCD do servidor percebe o commit e atualiza o ambiente (mesmo desenho da ADR-0015
# do Mais Saúde Pública). Na main, cria também a release da versão do pom.xml.
# Segredo necessário: AUTOMERGE_PAT (token com permissão de escrita no repositório), para o commit de pin
# poder entrar na branch protegida e disparar o ArgoCD.
name: Publicar imagens (ghcr.io)

on:
  push:
    branches:
      - developer
      - main

jobs:
  publish:
    # O commit de pin é feito com PAT e conta como push: sem esta guarda, o próprio pin dispararia outro build.
    if: "!startsWith(github.event.head_commit.message, 'chore: pin ')"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - context: .
            image: aqua-qe-platform
          - context: frontend
            image: aqua-qe-platform-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/dufelizardo/${{ matrix.image }}:${{ github.ref_name }}
            ghcr.io/dufelizardo/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  pin-manifests:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.AUTOMERGE_PAT }}
      - name: Pinar o overlay do ambiente no SHA deste build
        run: |
          case "${{ github.ref_name }}" in
            developer) overlay=k8s/apps/overlays/dev ;;
            main) overlay=k8s/apps/overlays/prod ;;
          esac
          sed -i "s#newTag: .*#newTag: ${{ github.sha }}#" "$overlay/kustomization.yaml"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$overlay/kustomization.yaml"
          if git diff --cached --quiet; then
            echo "Overlay já pinado nesta imagem."
          else
            git commit -m "chore: pin ${{ github.ref_name }} a ${{ github.sha }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

  release:
    needs: publish
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Criar a release da versão do pom.xml, se ainda não existir
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          versao=$(sed -n '/<artifactId>aqua-qe-platform<\/artifactId>/{n;s/.*<version>\(.*\)<\/version>.*/\1/p}' pom.xml)
          if gh release view "v${versao}" > /dev/null 2>&1; then
            echo "::warning::A versão ${versao} já tem release. Se este push traz código novo, incremente <version> no pom.xml."
          else
            gh release create "v${versao}" --target "${{ github.sha }}" --title "v${versao}" --generate-notes
          fi
