# Pipeline de promoção (ADR-15): developer → main.
#   push na developer e todo PR: backend (JUnit, Testcontainers, Spring Modulith), frontend (build e testes),
#   Robot --dryrun e CodeQL.
#   PR para a main (promoção para prod): além disso, a aceitação Robot (API e interface) contra a pilha real
#   subida pelo docker compose. Os checks são obrigatórios na proteção da main (doc/OPERACAO.md).
# Retentativas (ADR-18): passos de rede tentam até 3 vezes; o Robot reexecuta uma vez só os testes que falharam e
# abre issue para os instáveis; o job de aceitação inteiro é retentado até 2 vezes pelo retry-acceptance.yml.
name: Pipeline de Promoção

on:
  push:
    branches:
      - developer
  pull_request:
    branches:
      - developer
      - main
  workflow_dispatch:

concurrency:
  group: pipeline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Baixar o Maven do wrapper (até 3 tentativas)
        run: |
          for i in 1 2 3; do
            ./mvnw -B -q --version && exit 0
            echo "::warning::Download do Maven falhou (tentativa $i de 3)"; sleep $((i * 15))
          done
          exit 1
      - name: Build e testes (JUnit, Testcontainers, fronteiras de módulo)
        run: ./mvnw -B verify -Daether.connector.http.retryHandler.count=5
      - name: Relatórios de teste
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Build de produção
        run: npx ng build --configuration production
      - name: Testes unitários
        run: npx ng test --watch=false

  robot-dryrun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: test/robot/requirements.txt
      - run: pip install -r test/robot/requirements.txt
      - name: Sintaxe e imports das suítes Robot
        run: bash test/robot/run_tests.sh all --dryrun
      # PROP-003, Fase 1: camadas LKDF verificadas a cada push (bloqueia com violação não excetuada).
      - name: Testes do validador LKDF
        run: python -m unittest discover -s test/robot/tools/tests
      - name: Conformidade LKDF
        run: python test/robot/tools/lkdf_lint.py
      # PROP-003, Fase 0: inventário de suítes, casos e rastreabilidade, calculado a cada execução.
      - name: Inventário das suítes
        if: always()
        run: python test/robot/tools/inventory.py
      - name: Publicar o inventário
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-inventory
          path: |
            test/robot/results/inventory.md
            test/robot/results/inventory.json
          if-no-files-found: ignore
          retention-days: 30

  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v3

  acceptance:
    needs: [backend, frontend, robot-dryrun]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.base_ref == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Subir a pilha (PostgreSQL, Keycloak, API e frontend; até 3 tentativas)
        run: |
          for i in 1 2 3; do
            docker compose up -d --build --wait --wait-timeout 900 && exit 0
            echo "::warning::A pilha não subiu (tentativa $i de 3)"
            docker compose logs --no-color --tail 50 || true
            docker compose down -v || true
            sleep $((i * 20))
          done
          exit 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: test/robot/requirements.txt
      - name: Instalar Robot Framework e o Chromium (até 3 tentativas)
        run: |
          pip install --retries 5 -r test/robot/requirements.txt
          for i in 1 2 3; do
            rfbrowser init --with-deps chromium && exit 0
            echo "::warning::Instalação do Chromium falhou (tentativa $i de 3)"; sleep $((i * 15))
          done
          exit 1
      - name: Aceitação Robot (API e interface; reexecuta uma vez os que falharem)
        run: bash test/robot/ci_run.sh
      - name: Abrir issue para testes instáveis
        if: always() && hashFiles('test/robot/results/flaky.txt') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -s test/robot/results/flaky.txt ] || exit 0
          while IFS= read -r teste; do
            [ -z "$teste" ] && continue
            titulo="[Teste instável] ${teste}"
            existente=$(gh issue list --state open --label "teste instável" --search "in:title \"${teste}\"" --json number --jq '.[0].number // empty')
            if [ -n "$existente" ]; then
              gh issue comment "$existente" --body "Falhou e passou na reexecução de novo: ${RUN_URL}"
            else
              gh issue create --title "$titulo" --label "teste instável" --label "tipo: débito técnico" --label "área: testes"                 --body "O teste falhou na primeira execução da aceitação e passou na reexecução: ${RUN_URL}

          Um teste instável esconde defeitos reais. Investigar a causa (espera, dados, concorrência) e corrigir; ver doc/QA.md, seção 9."
            fi
          done < test/robot/results/flaky.txt
      - name: Logs dos containers
        if: failure()
        run: docker compose logs --no-color > compose.log
      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-results
          path: |
            test/robot/results/
            compose.log
          if-no-files-found: ignore
      - name: Derrubar a pilha
        if: always()
        run: docker compose down -v
