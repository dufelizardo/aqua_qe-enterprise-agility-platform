# Retentativa automática da aceitação (ADR-18), último recurso depois das retentativas de rede e do --rerunfailed.
# Quando o "Pipeline de Promoção" de um PR falha só no job acceptance, reexecuta esse job até 2 vezes (3 tentativas
# no total), comenta no PR e reexecuta o auto-merge, que desiste ao ver um check vermelho. Se falhar outro job
# (backend, frontend, robot-dryrun), não retenta: é falha de código, não de ambiente.
name: Retentativa da aceitação

on:
  workflow_run:
    workflows: ["Pipeline de Promoção"]
    types: [completed]

permissions:
  actions: write
  pull-requests: write

jobs:
  retry:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    steps:
      - name: Reexecutar a aceitação e o auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          failed=$(gh run view "$RUN_ID" --attempt "$ATTEMPT" --json jobs --jq '[.jobs[] | select(.conclusion=="failure") | .name] | join(",")')
          if [ "$failed" != "acceptance" ]; then
            echo "Falharam: ${failed:-nenhum job identificado}. Só a aceitação é retentada automaticamente."
            exit 0
          fi
          next=$((ATTEMPT + 1))
          gh run rerun "$RUN_ID" --failed
          pr=$(gh pr list --state open --search "$HEAD_SHA" --json number --jq '.[0].number // empty')
          if [ -n "$pr" ]; then
            gh pr comment "$pr" --body "A aceitação falhou na tentativa ${ATTEMPT} (${RUN_URL}). Retentativa automática: tentativa ${next} de 3. Se falhar de novo, ver os resultados do Robot e os logs dos containers nos artefatos do job."
          fi
          # O auto-merge desiste quando vê um check vermelho; depois que a aceitação volta a rodar, ele espera de novo.
          sleep 45
          am=$(gh run list --workflow auto-merge.yml --limit 20 --json databaseId,headSha --jq ".[] | select(.headSha==\"$HEAD_SHA\") | .databaseId" | head -1)
          if [ -n "$am" ]; then
            gh run rerun "$am" || echo "Não foi possível reexecutar o auto-merge ($am)."
          fi
